[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "science-researcher"
version = "0.1.0"
description = "An AI-native scientific discovery system for structural analogies, hypothesis generation, and falsification."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Hidenori Endo"}]
dependencies = []

[project.scripts]
science-researcher = "science_researcher.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
science_researcher = ["py.typed"]
